# Development-only in-cluster dependencies for ATLAS (OrbStack / kind / minikube):
# PostgreSQL 16 (ATLAS inventory + Temporal persistence) and Temporal auto-setup + UI.
# Production deployments use a managed PostgreSQL and the official Temporal chart / Temporal Cloud.
apiVersion: v1
kind: Namespace
metadata:
  name: atlas
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dev
  namespace: atlas
type: Opaque
stringData:
  POSTGRES_USER: atlas
  POSTGRES_PASSWORD: atlas
  POSTGRES_DB: atlas
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: atlas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: atlas
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef: { name: postgres-dev }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "atlas"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: atlas
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: temporal-dynamicconfig
  namespace: atlas
data:
  development-sql.yaml: |
    frontend.enableClientVersionCheck:
      - value: true
    history.persistenceMaxQPS:
      - value: 3000
    frontend.persistenceMaxQPS:
      - value: 3000
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: atlas
  labels: { app: temporal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal }
  template:
    metadata:
      labels: { app: temporal }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h postgres -U atlas; do sleep 2; done"]
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: POSTGRES_USER, value: atlas }
            - { name: POSTGRES_PWD, value: atlas }
            - { name: DBNAME, value: temporal }
            - { name: VISIBILITY_DBNAME, value: temporal_visibility }
            - { name: DYNAMIC_CONFIG_FILE_PATH, value: /etc/temporal/config/dynamicconfig/development-sql.yaml }
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
          ports:
            - containerPort: 7233
          volumeMounts:
            - name: dynamicconfig
              mountPath: /etc/temporal/config/dynamicconfig
          readinessProbe:
            tcpSocket: { port: 7233 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: dynamicconfig
          configMap: { name: temporal-dynamicconfig }
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: atlas
spec:
  selector: { app: temporal }
  ports:
    - port: 7233
      targetPort: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: atlas
  labels: { app: temporal-ui }
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal-ui }
  template:
    metadata:
      labels: { app: temporal-ui }
    spec:
      containers:
        - name: ui
          image: temporalio/ui:2.31.2
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
            - { name: TEMPORAL_CORS_ORIGINS, value: "http://localhost:8080" }
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: atlas
spec:
  selector: { app: temporal-ui }
  ports:
    - port: 8080
      targetPort: 8080
