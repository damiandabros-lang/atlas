# OpenTelemetry Collector (contrib) — receives OTLP from ATLAS api/worker, exports to Jaeger.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Belt-and-braces redaction: ATLAS already redacts credentials in-process, but never let
  # a password-like attribute leave the collector either.
  attributes/redact:
    actions:
      - key: device.password
        action: delete
      - key: http.request.header.x-api-key
        action: delete
      - key: db.statement
        action: hash

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlp/jaeger, debug]
