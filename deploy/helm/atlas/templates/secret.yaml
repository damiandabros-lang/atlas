{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  annotations:
    # Created BEFORE the pre-install/pre-upgrade migration Job (hooks run ahead of regular
    # resources, and the Job needs this). Kept across upgrades; removed by `helm uninstall`
    # only via the chart's NOTES / make k8s-down cleanup, as hook resources are not release-tracked.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # Keys are consumed as environment variables via envFrom.secretRef.
  ATLAS_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.existingSecret is empty" .Values.secrets.databaseUrl | quote }}
  ATLAS_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  ATLAS_DEVICE_USERNAME: {{ .Values.secrets.deviceUsername | quote }}
  ATLAS_DEVICE_PASSWORD: {{ .Values.secrets.devicePassword | quote }}
{{- end }}
