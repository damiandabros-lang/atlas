{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atlas.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Keys are consumed as environment variables via envFrom.secretRef.
  ATLAS_DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.existingSecret is empty" .Values.secrets.databaseUrl | quote }}
  ATLAS_API_KEYS: {{ .Values.secrets.apiKeys | quote }}
  ATLAS_DEVICE_USERNAME: {{ .Values.secrets.deviceUsername | quote }}
  ATLAS_DEVICE_PASSWORD: {{ .Values.secrets.devicePassword | quote }}
{{- end }}
