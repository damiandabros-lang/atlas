apiVersion: v1
kind: Service
metadata:
  name: {{ include "atlas.fullname" . }}-worker-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "atlas.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
