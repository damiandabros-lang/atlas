{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "atlas.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atlas.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # API from anywhere in the cluster (ingress controller / operators).
    - ports:
        - port: {{ .Values.config.apiPort }}
          protocol: TCP
    # Worker metrics only from Prometheus-labelled pods.
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: {{ .Values.worker.metricsPort }}
          protocol: TCP
{{- end }}
