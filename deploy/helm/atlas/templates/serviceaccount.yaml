{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "atlas.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
  annotations:
    # Created BEFORE the pre-install/pre-upgrade migration Job (hooks run ahead of regular
    # resources, and the Job needs this). Kept across upgrades; removed by `helm uninstall`
    # only via the chart's NOTES / make k8s-down cleanup, as hook resources are not release-tracked.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
