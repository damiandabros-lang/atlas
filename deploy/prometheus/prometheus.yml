# Prometheus scrape configuration for the ATLAS compose stack.
global:
  scrape_interval: 10s
  evaluation_interval: 30s
  external_labels:
    environment: dev
    platform: atlas

scrape_configs:
  # FastAPI gateway — exposes Prometheus metrics at /api/v1/metrics
  - job_name: atlas-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  # Temporal worker — standalone prometheus_client exporter on :9090
  - job_name: atlas-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]
        labels:
          component: worker

  # Temporal server metrics (auto-setup exposes them on 8000 inside the container when enabled)
  - job_name: temporal
    metrics_path: /metrics
    static_configs:
      - targets: ["temporal:8000"]
        labels:
          component: temporal

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
