name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  CHART_DIR: deploy/helm/atlas

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  chart:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Stamp chart version with the tag
        run: |
          v="${{ needs.image.outputs.version }}"
          sed -i "s/^version:.*/version: ${v}/" "$CHART_DIR/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${v}\"/" "$CHART_DIR/Chart.yaml"
          helm lint "$CHART_DIR" --strict
      - run: helm package "$CHART_DIR" --destination dist/
      - name: Push chart to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/atlas-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [image, chart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist/
      - name: Generate release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## ATLAS ${GITHUB_REF_NAME}"
            echo
            echo "Image: \`${IMAGE_NAME}:${{ needs.image.outputs.version }}\`"
            echo "Chart: \`oci://ghcr.io/${{ github.repository_owner }}/charts/atlas:${{ needs.image.outputs.version }}\`"
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then git log --pretty='- %s (%h)' "${prev}..${GITHUB_REF_NAME}"; else git log --pretty='- %s (%h)'; fi
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*.tgz
          generate_release_notes: false
