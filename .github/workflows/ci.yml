name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- lint ----
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # ----------------------------------------------------------- typecheck ----
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy atlas

  # ---------------------------------------------------------------- test ----
  test:
    name: Tests (pytest + PostgreSQL + Temporal)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      temporal:
        image: temporalio/auto-setup:1.25
        env:
          DB: postgres12
          DB_PORT: "5432"
          POSTGRES_USER: atlas
          POSTGRES_PWD: atlas
          POSTGRES_SEEDS: postgres
          DBNAME: temporal
          VISIBILITY_DBNAME: temporal_visibility
          ENABLE_ES: "false"
          LOG_LEVEL: warn
        ports: ["7233:7233"]
    env:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas
      ATLAS_TEMPORAL_HOST: localhost:7233
      ATLAS_TEMPORAL_NAMESPACE: default
      ATLAS_LOG_JSON: "false"
      ATLAS_MOCK_LATENCY_MS: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Wait for Temporal frontend
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/7233) 2>/dev/null; then echo "temporal up"; exit 0; fi
            sleep 2
          done
          echo "temporal did not become ready" >&2; exit 1
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q --cov=atlas --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ----------------------------------------------------- migration-check ----
  migration-check:
    name: Migrations (upgrade / downgrade / autogenerate drift)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Exactly one head
        run: |
          heads=$(alembic heads | wc -l)
          test "$heads" -eq 1 || { echo "expected 1 alembic head, found $heads" >&2; exit 1; }
      - name: Downgrade one revision and re-upgrade
        run: alembic downgrade -1 && alembic upgrade head
      - name: Models match migrations (autogenerate must be empty)
        continue-on-error: true   # advisory until the schema stabilises
        run: |
          alembic revision --autogenerate -m ci_drift_check --rev-id ci_drift_check
          f=$(ls alembic/versions/*ci_drift_check*.py)
          if grep -Eq 'op\.(create|drop|add|alter|rename)_' "$f"; then
            echo "::error::Model/migration drift detected:"; cat "$f"; exit 1
          fi
          rm -f "$f"

  # -------------------------------------------------------------- docker ----
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image (entrypoint + CLI resolve)
        if: github.event_name == 'pull_request'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm -e ATLAS_WAIT_FOR_DB=0 -e ATLAS_WAIT_FOR_TEMPORAL=0 "$tag" python -c "import atlas, temporalio, fastapi; print('ok')"

  # ---------------------------------------------------------------- helm ----
  helm:
    name: Helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/atlas --strict
      - name: Render with all optional resources
        run: |
          helm template atlas deploy/helm/atlas \
            --set api.hpa.enabled=true \
            --set api.ingress.enabled=true \
            --set serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set migrations.seed=true > rendered.yaml
          grep -c '^kind:' rendered.yaml
      - name: Validate rendered manifests against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: >-
            -strict -summary -ignore-missing-schemas
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            rendered.yaml

  # -------------------------------------------------------------- compose ----
  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env && docker compose config --quiet
